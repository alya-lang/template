[package]
name = "{{PACKAGE_NAME}}"
version = "0.1.0"
alya-version = "0.0.20"
entry = "src/lib.alya"
description = "{{DESCRIPTION}}"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/{{PACKAGE_NAME}}"
keywords = ["alya", "alya-lang", "package", "{{PACKAGE_NAME}}"]

[dependencies]
# Optional dependencies install only when an active feature names them:
# extra = { git = "https://github.com/alya-lang/extra", tag = "v0.1.0", optional = true }

# Optional: feature-gated API slices. Members name another feature or an
# optional dependency; gate the using code with `@cfg(feature = "...")`
# and provide a `@cfg(not(feature = "..."))` fallback stub in `src/lib.alya`
# so callers get a clear descriptive error instead of an undefined reference.
# `extras` is a standalone capability slice (`src/core/extras.alya`);
# `strict` is the structured-error recovery slice (`src/core/errors.alya`
# plus the strict/try engines in `src/core/pipeline.alya`). `default` is
# active unless the caller passes `--no-default-features`; select features
# explicitly via `alya build/run/test/bench/install --features <a,b>`.
[features]
default = ["extras", "strict"]
extras = []
strict = []
# extra = ["extra"]

